CSV_LargeCaps_RealState:
  type: pandas.CSVDataset
  filepath: "data/02_intermediate/02_1. StockUniverse/LargeCaps_RealState.csv"
  
  load_args:
    sep: ","
    na_values: ["#NA", NA]
  save_args:
    index: False
    date_format: "%Y-%m-%d %H:%M"
    decimal: .

  fs_args:
    open_args_save:
      mode: "w"
      encoding: "utf-8"
      newline: ""


